agt_asensing_driver:
  ros__parameters:
    port: /dev/ttyUSB0
    baudrate: 460800
    ins_frame_id: ins_link
    gnss_frame_id: rtk_antenna_link
    # Keep false until R3 physical direction tests prove the device roll/pitch/yaw
    # convention matches the ROS REP-103 frame used by ins_frame_id.
    use_device_orientation_in_imu: false
    # ASENSING position types observed in the local ROS2 driver config:
    # 48=L1_INT, 49=WIDE_INT, 50=NARROW_INT.
    rtk_fixed_types: [48, 49, 50]
